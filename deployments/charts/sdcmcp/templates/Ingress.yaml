{{- if and (eq .Values.PAAS_PLATFORM "KUBERNETES") .Values.simpleDataComparatorMcp.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sdcmcp.name" . }}
  labels:
    {{- include "sdcmcp.labels" . | nindent 4 }}
  {{- with .Values.simpleDataComparatorMcp.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.simpleDataComparatorMcp.ingress.className }}
  ingressClassName: {{ .Values.simpleDataComparatorMcp.ingress.className }}
  {{- end }}
  {{- if .Values.simpleDataComparatorMcp.ingress.tls }}
  tls:
    - hosts:
        - {{ include "sdcmcp.ingressHost" . }}
  {{- end }}
  rules:
    - host: {{ include "sdcmcp.ingressHost" . | quote }}
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: {{ include "sdcmcp.name" . }}
                port:
                  number: {{ .Values.simpleDataComparatorMcp.mcpPort }}
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: {{ include "sdcmcp.name" . }}
                port:
                  number: {{ .Values.simpleDataComparatorMcp.mcpPort }}
{{- end }}
